name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO: drop this gate and its `if:`s once app/index.html is committed.
      # Until then there's nothing to deploy, and the run passes as a no-op.
      - id: app
        run: |
          if [ -f app/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No app/index.html yet: nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.app.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app
      - if: steps.app.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
